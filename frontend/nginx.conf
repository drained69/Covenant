server {
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # react-router owns /markets, /compliance, /positions, etc. (App.tsx). Those
    # paths have no file on disk, so without this fallback a refresh or a shared
    # deep link would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
